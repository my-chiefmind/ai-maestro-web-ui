<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How AI Maestro Web UI works</title>
  <desc id="d">Projects on disk are read and written through the AI Maestro API with locking. The dashboard server reads the project list from the dashboard folder, talks to the API, and serves your browser over loopback-only HTTP.</desc>
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f6f8fa; stroke: #d0d7de; }
    .node { fill: #ffffff; stroke: #57606a; }
    .api { fill: #ddf4ff; stroke: #0969da; }
    .srv { fill: #dafbe1; stroke: #1a7f37; }
    .cfg { fill: #fff8c5; stroke: #9a6700; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .glabel { fill: #57606a; font-size: 13px; font-weight: 600; }
    .edge { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .elabel { fill: #57606a; font-size: 12px; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .group { fill: #161b22; stroke: #30363d; }
      .node { fill: #0d1117; stroke: #8b949e; }
      .api { fill: #0c2d6b; stroke: #58a6ff; }
      .srv { fill: #0f3d1f; stroke: #3fb950; }
      .cfg { fill: #3b2e00; stroke: #d29922; }
      .title { fill: #e6edf3; }
      .sub, .glabel, .elabel { fill: #8b949e; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M10,0 L0,5 L10,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1060" height="320"/>

  <!-- Projects group -->
  <rect class="group" x="20" y="40" width="240" height="260" rx="10"/>
  <text class="glabel" x="140" y="64" text-anchor="middle">Your projects on disk</text>
  <rect class="node" x="36" y="80" width="208" height="62" rx="8"/>
  <text class="title" x="140" y="106" text-anchor="middle">project-a/maestro</text>
  <text class="sub" x="140" y="127" text-anchor="middle">board · plan · specs · reports</text>
  <rect class="node" x="36" y="160" width="208" height="46" rx="8"/>
  <text class="title" x="140" y="188" text-anchor="middle">project-b/maestro</text>
  <rect class="node" x="36" y="224" width="208" height="46" rx="8"/>
  <text class="title" x="140" y="252" text-anchor="middle">project-c/maestro</text>

  <!-- Projects <-> API -->
  <path class="edge" d="M244,111 L380,160" marker-start="url(#start)" marker-end="url(#end)"/>
  <path class="edge" d="M244,183 L380,170" marker-start="url(#start)" marker-end="url(#end)"/>
  <path class="edge" d="M244,247 L380,180" marker-start="url(#start)" marker-end="url(#end)"/>
  <text class="elabel" x="318" y="112" text-anchor="middle">read /</text>
  <text class="elabel" x="318" y="127" text-anchor="middle">locked write</text>

  <!-- AI Maestro API -->
  <rect class="api" x="380" y="138" width="200" height="64" rx="8"/>
  <text class="title" x="480" y="165" text-anchor="middle">AI Maestro API</text>
  <text class="sub" x="480" y="186" text-anchor="middle">@mychiefmind/ai-maestro</text>

  <!-- API <-> server -->
  <path class="edge" d="M580,170 L640,170" marker-start="url(#start)" marker-end="url(#end)"/>

  <!-- Dashboard folder -->
  <rect class="cfg" x="630" y="30" width="190" height="60" rx="8"/>
  <text class="title" x="725" y="56" text-anchor="middle">dashboard folder</text>
  <text class="sub" x="725" y="76" text-anchor="middle">ai-maestro-dashboard.json</text>
  <path class="edge" d="M725,90 L725,138" marker-end="url(#end)"/>

  <!-- Dashboard server -->
  <rect class="srv" x="640" y="138" width="170" height="64" rx="8"/>
  <text class="title" x="725" y="165" text-anchor="middle">Dashboard server</text>
  <text class="sub" x="725" y="186" text-anchor="middle">127.0.0.1:3021</text>

  <!-- server <-> browser -->
  <path class="edge" d="M810,170 L920,170" marker-start="url(#start)" marker-end="url(#end)"/>
  <text class="elabel" x="865" y="148" text-anchor="middle">http,</text>
  <text class="elabel" x="865" y="162" text-anchor="middle">loopback only</text>

  <!-- Browser -->
  <rect class="node" x="920" y="145" width="120" height="50" rx="8"/>
  <text class="title" x="980" y="175" text-anchor="middle">Your browser</text>
</svg>
